services:
  researcher:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./research_outputs:/app/research_outputs
      - ./agent_files:/app/agent_files
    command: python main_deepagents.py

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    profiles:
      - local-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
